name: Test Using Mocha

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: yarn install frozen-lockfile
      - name: Run tests
        run: yarn test
      - run: echo "All tests passed"
